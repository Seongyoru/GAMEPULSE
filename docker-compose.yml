# Local development dependencies. `docker compose up -d`, then `pnpm db:migrate && pnpm seed`.
# Machines without Docker can use `pnpm services:local` (native PostgreSQL/Redis binaries).
name: gamepulse

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamepulse
      POSTGRES_PASSWORD: gamepulse
      POSTGRES_DB: gamepulse
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamepulse -d gamepulse']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
